# .github/workflows/trading_v5.yml
# Esegue trading_v5.py su GitHub Actions.
#
# NOVITÀ rispetto alla prima versione:
#  - accetta il secret con più nomi possibili (TWELVEDATA_API_KEY, TWELVE_DATA_API_KEY, ...)
#  - si ferma subito, con messaggio chiaro, se il secret non viene letto
#  - fallisce se non viene prodotto nessun file .xlsx (prima "riusciva" a vuoto)
#  - può pubblicare il report anche come Release, oltre che come artifact
#
# IMPORTANTE: il blocco "cache" conserva TRADING_V5/cache tra un'esecuzione e l'altra.
# Senza di esso ogni run riparte dalle sole 5000 candele scaricabili e la storia non cresce.
name: Trading v5

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "scan oppure backtest"
        default: "backtest"
        type: choice
        options: [backtest, scan]
      tf_set:
        description: "Set timeframe per lo scanner"
        default: "D1H4H1"
        type: choice
        options: [D1H4H1, H4H1M15]
      entry_mode:
        description: "Modalita ingresso per lo scanner"
        default: "reversal"
        type: choice
        options: [zone, reversal, pinbar]
      presets:
        description: "Preset del backtest (separati da virgola, vuoto = quelli di default)"
        default: ""
      pubblica_release:
        description: "Pubblica il report anche come Release"
        default: true
        type: boolean
  schedule:
    - cron: "0 5 1 * *"      # backtest mensile: 1 del mese, 05:00 UTC

permissions:
  contents: write            # necessario per creare la Release

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # Primo nome non vuoto tra questi. Aggiungi il tuo se il secret si chiama diversamente.
      TWELVEDATA_API_KEY: >-
        ${{ secrets.TWELVEDATA_API_KEY
         || secrets.TWELVE_DATA_API_KEY
         || secrets.TD_API_KEY
         || secrets.TWELVEDATA_KEY
         || secrets.API_KEY_TWELVEDATA
         || secrets.APIKEY_TWELVEDATA }}
    steps:
      - uses: actions/checkout@v4

      - name: Verifica il secret della API key
        run: |
          if [ -z "$TWELVEDATA_API_KEY" ]; then
            echo "::error::Nessun secret trovato. Vai in Settings > Secrets and variables > Actions, scheda 'Secrets', copia il NOME esatto del secret della chiave Twelvedata e aggiungilo all'elenco nel blocco env: di questo workflow (oppure rinomina il secret in TWELVEDATA_API_KEY)."
            exit 1
          fi
          echo "Secret trovato: ${#TWELVEDATA_API_KEY} caratteri."

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installa dipendenze
        run: pip install --quiet requests pandas numpy openpyxl pytz

      # Chiave sempre nuova (così la cache viene salvata a ogni run),
      # restore-keys recupera la più recente disponibile.
      - name: Ripristina cache candele
        uses: actions/cache@v4
        with:
          path: TRADING_V5/cache
          key: trading-v5-cache-${{ github.run_id }}
          restore-keys: |
            trading-v5-cache-

      - name: Esegui
        env:
          MODE: ${{ inputs.mode || 'backtest' }}
          TF_SET: ${{ inputs.tf_set || 'D1H4H1' }}
          ENTRY_MODE: ${{ inputs.entry_mode || 'reversal' }}
          BACKTEST_PRESETS: ${{ inputs.presets }}
          OUT_DIR: TRADING_V5
          REQUEST_DELAY: "8"
        run: python trading_v5.py

      - name: Verifica che il report esista
        run: |
          shopt -s nullglob
          files=(TRADING_V5/*.xlsx)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::Nessun file .xlsx prodotto: controlla il log dello step 'Esegui'."
            exit 1
          fi
          echo "REPORT=${files[-1]}" >> $GITHUB_ENV
          echo "Report: ${files[-1]}"

      - name: Carica report come artifact
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ inputs.mode || 'backtest' }}-${{ github.run_id }}
          path: TRADING_V5/*.xlsx
          if-no-files-found: error
          retention-days: 90

      - name: Pubblica Release
        if: ${{ inputs.pubblica_release != false }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v5-${{ inputs.mode || 'backtest' }}-$(date -u +%Y%m%d-%H%M)"
          gh release create "$TAG" "$REPORT" \
            --title "Trading v5 - ${{ inputs.mode || 'backtest' }} $(date -u +%d/%m/%Y) UTC" \
            --notes "Report generato dal run ${{ github.run_id }}."

      - name: Riepilogo candele in cache
        if: always()
        run: |
          echo "### Candele in cache" >> $GITHUB_STEP_SUMMARY
          shopt -s nullglob
          files=(TRADING_V5/cache/*.csv)
          if [ ${#files[@]} -eq 0 ]; then
            echo "- nessun file in cache (primo avvio oppure cache non ripristinata)" >> $GITHUB_STEP_SUMMARY
          else
            for f in "${files[@]}"; do
              echo "- $(basename "$f"): $(( $(wc -l < "$f") - 1 )) righe" >> $GITHUB_STEP_SUMMARY
            done
          fi
